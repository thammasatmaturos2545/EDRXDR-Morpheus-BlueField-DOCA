<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090e18">
  <meta name="description" content="NEXUS SIEM — Security operations dashboard for EDR and XDR. Investigate alerts, explore telemetry, and manage cases.">
  <title>NEXUS SIEM · Security operations</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./core.js"></script>
  <script defer src="./copilot-evidence.js"></script>
  <script defer src="./model-lab.js"></script>
  <script defer src="./dfp-diagnostic.js"></script>
  <script defer src="./app.js"></script>
  <script defer src="./all-events.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#overview" aria-label="Nexus SIEM home"><span class="brand-symbol"><svg viewBox="0 0 32 32" fill="none"><path d="M16 3 28 10v12L16 29 4 22V10Z" stroke="currentColor" stroke-width="2"/><path d="m10 21 6-12 6 12M12 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span>NEXUS<span class="brand-sub">SIEM PLATFORM</span></span></a>

      <div class="nav-caption">OPERATIONS</div>
      <nav id="main-nav"></nav>


      <div class="sidebar-bottom"><div class="pipeline-state"><span class="status-dot green"></span><span id="sidebar-state">Sample telemetry</span><span class="mini-tag" id="sidebar-mode">DEMO</span></div></div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <div class="breadcrumb"><button class="icon-button mobile-menu" id="mobile-menu" aria-label="Toggle navigation"></button><span class="breadcrumb-workspace">Workspace</span><span class="breadcrumb-slash">/</span><span id="breadcrumb-current">Security overview</span></div>
        <div class="topbar-actions"><div class="global-search"><span id="search-icon"></span><input id="global-search" aria-label="Search alerts across the workspace" placeholder="Search alerts, hosts, IPs…"><kbd>⌘ K</kbd></div><button class="icon-button notification-button" id="notification-button" data-action="critical-alerts" aria-label="View critical alerts"><span id="notification-icon"></span><i></i></button></div>
      </header>
      <main id="main" tabindex="-1"></main>
      <footer class="app-footer"><span><span class="status-dot green"></span> NEXUS SIEM <span class="footer-version">v1.0</span></span><span id="footer-data">Demo telemetry · for evaluation</span><span>EDR / XDR SECURITY OPERATIONS</span></footer>
    </div>
  </div>
  <div class="overlay" id="overlay" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Details" hidden></aside>
  <dialog id="modal" class="modal"></dialog>
  <div class="toast-stack" id="toasts" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <noscript><div class="noscript">Enable JavaScript to use NEXUS SIEM.</div></noscript>
</body>
</html>
